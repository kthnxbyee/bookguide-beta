<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#161b22" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%2317202a%27/%3E%3Ctext x=%2732%27 y=%2744%27 text-anchor=%27middle%27 font-size=%2738%27%3E📚%3C/text%3E%3C/svg%3E" />
<title>Book Content Guide Beta</title>

<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<style>
  :root{
    --bg:#f5f3ee;--panel:#ffffff;--panel2:#ece8df;--ink:#17202a;--muted:#6d756f;--line:#ddd8cd;
    --accent:#4c6759;--accent2:#d6b265;--warn:#b8683a;--danger:#a54848;--good:#3b7a57;
    --hero1:#1b2420;--hero2:#33483e;--heroText:#ffffff;--heroMuted:#e8eee9;
    --input:#fbfaf7;--header:rgba(245,243,238,.93);--nav:rgba(255,255,255,.95);
    --noticeBg:#fff6e8;--noticeBorder:#f0d4aa;--noticeText:#6f4d26;
    --confidenceBg:#edf4ef;--confidenceText:#2f6245;--sourceBg:#eef3f1;--sourceText:#3c6253;
    --shadow:0 10px 30px rgba(27,31,35,.08);--radius:22px;--radius2:14px;
  }
  *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  button,input,select{font:inherit} button{cursor:pointer}
  .app-shell{min-height:100vh;padding-bottom:92px}
  header{position:sticky;top:0;z-index:20;background:var(--header);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar{max-width:980px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px}.brandmark{width:42px;height:42px;border-radius:14px;background:var(--ink);color:white;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
  .brand h1{font-size:17px;margin:0}.brand small{display:block;color:var(--muted);margin-top:2px}
  .icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;width:42px;height:42px}
  main{max-width:980px;margin:0 auto;padding:18px}
  .hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--heroText);padding:24px;border-radius:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-65px;top:-55px;background:rgba(214,178,101,.2)}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;opacity:.8}.hero h2{font-size:30px;line-height:1.05;margin:8px 0 10px;max-width:650px}.hero p{margin:0;color:var(--heroMuted);max-width:650px;line-height:1.5}
  .search-card{background:var(--panel);padding:14px;border-radius:20px;margin-top:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .search-row{display:flex;gap:10px}.search-row input{flex:1;border:1px solid var(--line);background:var(--input);border-radius:14px;padding:14px 15px;outline:none}.search-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,103,89,.12)}
  .btn{border:0;border-radius:14px;padding:12px 16px;background:var(--accent);color:white;font-weight:800}.btn.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}.btn.full{width:100%}
  .stack{display:grid;gap:14px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:22px}.section-head h2{font-size:18px;margin:0}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}
  .result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .book-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:82px 1fr;gap:14px;box-shadow:0 5px 18px rgba(27,31,35,.05)}
  .cover{width:82px;height:116px;border-radius:10px;background:var(--panel2);object-fit:cover;border:1px solid var(--line)}.book-card h3{font-size:16px;margin:0 0 5px}.book-meta{font-size:12px;color:var(--muted);line-height:1.45}.book-actions{display:flex;gap:8px;margin-top:10px}.book-actions .btn{padding:9px 12px;font-size:12px}
  .empty{border:1px dashed var(--line);border-radius:18px;padding:26px;text-align:center;color:var(--muted);background:rgba(255,255,255,.5)}
  .detail{display:grid;gap:14px}.detail-top{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;grid-template-columns:110px 1fr;gap:18px;box-shadow:var(--shadow)}.detail-top .cover{width:110px;height:160px}.detail-top h2{margin:0 0 6px;font-size:24px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{background:var(--panel2);border:1px solid var(--line);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .rating-overview{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 5px 18px rgba(27,31,35,.04)}
  .score-big{font-size:44px;font-weight:900;line-height:1}.score-label{font-size:12px;color:var(--muted)}
  .confidence{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;background:var(--confidenceBg);color:var(--confidenceText);font-size:12px;font-weight:800;margin-top:10px}
  .warning-grid{display:grid;gap:10px}.warning-row{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center}.bar{height:9px;background:var(--panel2);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent2),var(--danger));border-radius:inherit}.level{font-size:12px;font-weight:800;text-align:right}.warning-name{font-size:13px;font-weight:750}
  .notice{border-radius:16px;padding:12px 13px;background:var(--noticeBg);border:1px solid var(--noticeBorder);color:var(--noticeText);font-size:13px;line-height:1.45}
  .rate-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px}.rate-card h3{margin:0 0 4px}.rate-group{padding:14px 0;border-top:1px solid var(--line)}.rate-group:first-of-type{border-top:0}.rate-group-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale button{border:1px solid var(--line);background:var(--input);padding:10px 4px;border-radius:11px;font-size:11px;font-weight:800;color:var(--muted)}.scale button.selected{background:var(--accent);color:white;border-color:var(--accent)}
  .age-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.age-grid button{border:1px solid var(--line);background:var(--input);padding:10px 3px;border-radius:11px;font-weight:800;font-size:11px}.age-grid button.selected{background:var(--accent);color:white}
  .stars{display:flex;gap:6px}.star{font-size:28px;border:0;background:transparent;color:#c9c5bc;padding:0}.star.selected{color:#d6a93f}
  .saved-row{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}.saved-row img{width:48px;height:68px;object-fit:cover;border-radius:7px;background:var(--panel2)}.saved-row .grow{flex:1}.saved-row strong{display:block}
  .settings-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px}.toggle-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.toggle-row:last-child{border-bottom:0}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--nav);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .nav-inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav-btn{border:0;background:transparent;border-radius:14px;padding:9px 4px;color:var(--muted);font-size:11px;font-weight:800}.nav-btn span{display:block;font-size:19px;margin-bottom:2px}.nav-btn.active{background:var(--panel2);color:var(--ink)}
  dialog{border:0;border-radius:22px;width:min(560px,calc(100% - 24px));padding:0;box-shadow:0 30px 90px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(20,25,22,.55)}.modal{padding:20px}.modal h2{margin-top:0}
  .source-pill{font-size:10px;font-weight:800;background:var(--sourceBg);color:var(--sourceText);border-radius:999px;padding:5px 7px;display:inline-block;margin-top:8px}
  .privacy-line{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4}
  .theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
  .theme-card{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:17px;padding:12px;display:grid;gap:9px;transition:.18s ease;box-shadow:0 3px 12px rgba(0,0,0,.03)}
  .theme-card:hover{transform:translateY(-1px)}.theme-card.selected{border:2px solid var(--accent);padding:11px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
  .theme-swatches{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid rgba(127,127,127,.18)}.theme-swatches span{flex:1}
  .theme-card strong{font-size:13px}.theme-card small{color:var(--muted);font-size:10px}.theme-card .chosen{font-size:10px;color:var(--accent);font-weight:900}
  .theme-section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.theme-section-title h2{margin:0}.mode-badge{font-size:10px;border-radius:999px;padding:5px 8px;background:var(--panel2);color:var(--muted);font-weight:800}

  .unified-search-note{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.45}
  .search-status{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px}
  .search-spinner{width:17px;height:17px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:bcgSpin .8s linear infinite;flex:0 0 auto}
  @keyframes bcgSpin{to{transform:rotate(360deg)}}
  .data-details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .data-details summary{cursor:pointer;color:var(--muted);font-size:11px;font-weight:800}
  .data-details p{margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
  .catalog-btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:14px;padding:11px 12px;font-weight:800;text-align:left}
  .catalog-btn small{display:block;color:var(--muted);font-weight:600;margin-top:2px}
  .catalog-btn.busy{opacity:.62;pointer-events:none}
  .add-book-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .form-field{display:grid;gap:6px;margin:10px 0}.form-field label{font-size:12px;font-weight:800}.form-field input,.form-field textarea,.form-field select{width:100%;border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:12px;padding:11px 12px}.form-field textarea{min-height:90px;resize:vertical}
  .analysis-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 5px 18px rgba(27,31,35,.04)}
  .analysis-status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.analysis-kpi{background:var(--panel2);border-radius:14px;padding:10px}.analysis-kpi strong{display:block;font-size:18px}.analysis-kpi span{font-size:10px;color:var(--muted)}
  .source-stack{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.source-stack .source-pill{margin-top:0}
  .rights-badge{background:var(--confidenceBg);color:var(--confidenceText);font-size:10px;font-weight:900;padding:6px 8px;border-radius:999px;display:inline-block;margin-top:8px}
  .upload-box{border:1px dashed var(--line);background:var(--panel2);border-radius:16px;padding:14px;margin:12px 0}.upload-box input{width:100%}
  .analysis-note{font-size:11px;color:var(--muted);line-height:1.5}

  .evidence-badge{display:inline-flex;align-items:center;gap:6px;background:var(--confidenceBg);color:var(--confidenceText);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;margin-top:7px}
  .source-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 5px 18px rgba(27,31,35,.04)}

  .content-explanations{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 5px 18px rgba(27,31,35,.04)}
  .spoiler-note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;margin:12px 0 14px}
  .content-detail{border:1px solid var(--line);border-radius:16px;background:var(--panel2);overflow:hidden;margin-top:9px}
  .content-detail summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800}
  .content-detail summary::-webkit-details-marker{display:none}
  .content-detail summary:after{content:'＋';font-size:18px;color:var(--muted)}
  .content-detail[open] summary:after{content:'−'}
  .detail-rating{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .severity-pill{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
  .content-detail-body{padding:0 14px 14px;color:var(--ink);font-size:14px;line-height:1.65}
  .content-detail-body p{margin:0}
  .age-rationale{border-left:4px solid var(--accent2);padding-left:12px;margin-top:12px;font-size:14px;line-height:1.6}

  .source-list{display:grid;gap:10px;margin-top:12px}.source-item{border:1px solid var(--line);background:var(--input);border-radius:15px;padding:12px}.source-item a{color:var(--accent);font-weight:850;text-decoration:none}.source-item a:hover{text-decoration:underline}
  .trigger-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.trigger-chip{border:1px solid var(--noticeBorder);background:var(--noticeBg);color:var(--noticeText);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}
  .method-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}.pre-rated{background:var(--confidenceBg);color:var(--confidenceText);font-size:10px;font-weight:900;border-radius:999px;padding:5px 7px;display:inline-block;margin-left:6px}
  .level-text{font-size:9px;color:var(--muted);font-weight:700;display:block;text-align:right;white-space:nowrap}.warning-value{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .search-source-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.search-source-line span{font-size:10px;border-radius:999px;padding:4px 7px;background:var(--panel2);color:var(--muted);font-weight:800}
  .search-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.network-note{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:var(--input);font-size:11px;color:var(--muted);line-height:1.45}.network-note strong{color:var(--ink)}
  @media(max-width:700px){.hero h2{font-size:26px}.search-row{flex-direction:column}.detail-top{grid-template-columns:82px 1fr}.detail-top .cover{width:82px;height:120px}.rating-overview{grid-template-columns:1fr}.warning-row{grid-template-columns:120px 1fr 36px}.age-grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:520px){.theme-grid{grid-template-columns:1fr}}
  @media(max-width:430px){main{padding:14px}.book-card{grid-template-columns:68px 1fr}.cover{width:68px;height:98px}.warning-row{grid-template-columns:105px 1fr 30px;gap:7px}.hero{padding:20px}.hero h2{font-size:23px}}
</style>
</head>
<body>
<div class="app-shell">
<header><div class="topbar"><div class="brand"><div class="brandmark">📚</div><div><h1>Book Content Guide</h1><small>Know what’s inside before they read.</small></div></div><div style="display:flex;gap:8px;align-items:center"><button id="installAppBtn" class="btn secondary" style="padding:9px 12px" onclick="installBookGuide()">Add to phone</button><button class="icon-btn" onclick="openAbout()">ⓘ</button></div></div></header>
<main id="app"></main>
<nav class="bottom-nav"><div class="nav-inner">
  <button class="nav-btn active" data-route="search"><span>🔎</span>Search</button>
  <button class="nav-btn" data-route="saved"><span>🔖</span>Saved</button>
  <button class="nav-btn" data-route="rate"><span>⭐</span>Rate</button>
  <button class="nav-btn" data-route="settings"><span>⚙️</span>Settings</button>
</div></nav>
<dialog id="modal"><div class="modal" id="modalContent"></div></dialog>
</div>
<script>
const themes={
  parchment:{name:'Parchment',mode:'Light',desc:'Warm paper and forest green',vars:{bg:'#f5f3ee',panel:'#ffffff',panel2:'#ece8df',ink:'#17202a',muted:'#6d756f',line:'#ddd8cd',accent:'#4c6759',accent2:'#d6b265',warn:'#b8683a',danger:'#a54848',good:'#3b7a57',hero1:'#1b2420',hero2:'#33483e',heroText:'#ffffff',heroMuted:'#e8eee9',input:'#fbfaf7',header:'rgba(245,243,238,.93)',nav:'rgba(255,255,255,.95)',noticeBg:'#fff6e8',noticeBorder:'#f0d4aa',noticeText:'#6f4d26',confidenceBg:'#edf4ef',confidenceText:'#2f6245',sourceBg:'#eef3f1',sourceText:'#3c6253'}},
  rose:{name:'Rose & Violet',mode:'Light',desc:'Layered pinks with purple accents',vars:{bg:'#fff1f7',panel:'#fffafd',panel2:'#f8dce9',ink:'#3c2333',muted:'#846274',line:'#efc9dc',accent:'#c94f88',accent2:'#8c5bc4',warn:'#cf6b82',danger:'#a93b68',good:'#7e5aa8',hero1:'#b63f79',hero2:'#7b4bb0',heroText:'#fff9fc',heroMuted:'#f9deea',input:'#fff6fa',header:'rgba(255,241,247,.94)',nav:'rgba(255,250,253,.96)',noticeBg:'#fce8f2',noticeBorder:'#eab9d2',noticeText:'#71334f',confidenceBg:'#f1e6f8',confidenceText:'#68428f',sourceBg:'#f8e3ee',sourceText:'#8a3e66'}},
  blossom:{name:'Blossom',mode:'Light',desc:'Soft coral, blush and plum',vars:{bg:'#fff6f3',panel:'#ffffff',panel2:'#fbe6df',ink:'#402a2d',muted:'#80686a',line:'#efd7d1',accent:'#d86f79',accent2:'#7b547d',warn:'#c6754d',danger:'#a64e5b',good:'#67836b',hero1:'#b95766',hero2:'#76516f',heroText:'#ffffff',heroMuted:'#f9e4e6',input:'#fffaf8',header:'rgba(255,246,243,.94)',nav:'rgba(255,255,255,.96)',noticeBg:'#fff0e8',noticeBorder:'#efcfbf',noticeText:'#754833',confidenceBg:'#eef3ec',confidenceText:'#4d684f',sourceBg:'#f7e9ee',sourceText:'#704b5d'}},
  sky:{name:'Sky',mode:'Light',desc:'Clean blue with aqua accents',vars:{bg:'#eef7fb',panel:'#ffffff',panel2:'#dfeff6',ink:'#20313d',muted:'#657b88',line:'#cfe2ea',accent:'#377ca3',accent2:'#49a7a0',warn:'#b77746',danger:'#a64c55',good:'#347c64',hero1:'#245d7c',hero2:'#327f86',heroText:'#ffffff',heroMuted:'#e0f2f5',input:'#f8fcfe',header:'rgba(238,247,251,.94)',nav:'rgba(255,255,255,.96)',noticeBg:'#fff4e8',noticeBorder:'#eed3b4',noticeText:'#6f4c2e',confidenceBg:'#e5f3ee',confidenceText:'#31624f',sourceBg:'#e4f1f6',sourceText:'#356278'}},

function genericDetail(category,score){
  const level=score?scaleLabels[Math.max(0,Math.min(4,Math.round(score)-1))]:'No data';
  if(!score)return 'The editorial profile does not currently have enough information to describe this category reliably.';
  if(score<=1)return 'No meaningful content in this category was identified as a significant part of the book.';
  if(score===2)return `This category is present only briefly or mildly. It does not appear to be a major focus of the book.`;
  return `This category is rated ${level}. A more book-specific explanation has not yet been added to the editorial profile.`;
}

function normalizeISBN(value){return String(value||'').toUpperCase().replace(/[^0-9X]/g,'')}
function isISBNLike(value){const n=normalizeISBN(value);return (n.length===10||n.length===13)&&/^[0-9]{9}[0-9X]$|^[0-9]{13}$/.test(n)}
function validISBN(value){
  const n=normalizeISBN(value);
  if(n.length===13){
    let sum=0;for(let i=0;i<13;i++)sum+=(+n[i])*(i%2?3:1);
    return sum%10===0;
  }
  if(n.length===10){
    let sum=0;for(let i=0;i<10;i++){const v=(i===9&&n[i]==='X')?10:+n[i];sum+=v*(10-i)}
    return sum%11===0;
  }
  return false;
}
function jsonpRequest(url,timeout=12000){
  return new Promise((resolve,reject)=>{
    const cb='bookGuideCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    let timer;
    const cleanup=()=>{clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}script.remove()};
    window[cb]=(data)=>{cleanup();resolve(data)};
    script.onerror=()=>{cleanup();reject(new Error('Catalog request was blocked'))};
    const join=url.includes('?')?'&':'?';
    script.src=url+join+'callback='+encodeURIComponent(cb);
    script.async=true;
    document.head.appendChild(script);
    timer=setTimeout(()=>{cleanup();reject(new Error('Catalog request timed out'))},timeout);
  });
}
function normalizeText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim()}

function dedupeBooks(list){const out=[],isbnMap=new Map(),taMap=new Map();const merge=(old,b)=>{const sourceNames=[...(old.sourceNames||[old.source]),...(b.sourceNames||[b.source])].filter(Boolean);return {...old,...b,source:old.source==='Built-in catalog'?b.source||old.source:old.source,sourceNames:[...new Set(sourceNames)],sourceId:b.sourceId||old.sourceId,cover:b.cover||old.cover,description:b.description||old.description,isbn:b.isbn||old.isbn,subjects:(b.subjects?.length?b.subjects:old.subjects)||[],publisher:b.publisher||old.publisher,year:b.year||old.year,pageCount:b.pageCount||old.pageCount,catalogRating:b.catalogRating||old.catalogRating||0,catalogRatingCount:b.catalogRatingCount||old.catalogRatingCount||0}};for(const b of list){if(!b||!b.title)continue;const ik=b.isbn?normalizeISBN(b.isbn):'',tk=`${normalizeText(b.title)}|${normalizeText(b.author)}`;let idx=ik&&isbnMap.has(ik)?isbnMap.get(ik):null;if(idx===null&&taMap.has(tk)){const ti=taMap.get(tk),old=out[ti];if(old.source==='Built-in catalog'||b.source==='Built-in catalog'||!old.isbn||!b.isbn)idx=ti}if(idx!==null){out[idx]=merge(out[idx],b);if(out[idx].isbn)isbnMap.set(normalizeISBN(out[idx].isbn),idx);taMap.set(tk,idx)}else{const ni=out.length;out.push(b);if(ik)isbnMap.set(ik,ni);taMap.set(tk,ni)}}return out}

async function googleLookup(query,seed){const qs=[];const p=titleAuthorParts(query);if(p)qs.push(`intitle:${p.title} inauthor:${p.author}`);else if(seed)qs.push(`intitle:${seed.title} inauthor:${seed.author}`);qs.push(query);let out=[],errors=[];for(const q of [...new Set(qs)]){try{const d=await jsonpRequest(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=20&printType=books`,10000);out.push(...(d?.items||[]).map(googleBook))}catch(e){errors.push('Google Books');break}}return {results:out,errors}}

async function searchBooks(){
  const input=document.getElementById('bookQuery'),q=(input?.value||lastQuery).trim();
  if(!q||searchBusy){if(!q){searchNotice='Enter a title, author, or ISBN first.';render()}return}
  lastQuery=q;
  const isbnMode=isISBNLike(q),isbn=normalizeISBN(q);
  if(isbnMode&&!validISBN(isbn)){searchNotice=`ISBN ${isbn} has an unusual checksum. Double-check the number and try again.`;render();return}

  searchBusy=true;catalogsChecked=[];
  let combined=isbnMode
    ?[...builtInBooks,...state.customBooks].filter(b=>normalizeISBN(b.isbn)===isbn)
    :searchBuiltIn(q);
  searchResults=rankSearchResults(combined,q);

  // Discovery is independent of content-guide coverage. Only an exact locally stored ISBN can short-circuit network lookup.
  if(isbnMode&&searchResults.length&&normalizeISBN(searchResults[0].isbn)===isbn){
    searchBusy=false;
    searchNotice='Found the exact ISBN in your local BookGuide catalog.';
    render();return;
  }

  const order=['google','openlibrary','isbndb','loc','crossref','internetarchive'];
  for(let i=0;i<order.length;i++){
    const source=order[i];
    searchProgress=i===0?'Searching book catalogs…':`Checking additional book catalogs…`;
    render();
    try{
      const found=await catalogSourceLookup(source,q);
      catalogsChecked.push(source);
      combined=dedupeBooks([...combined,...found]);
      searchResults=rankSearchResults(combined,q);
      // ISBN searches can stop on an exact identifier. Title/author searches always check at least
      // the two broadest catalogs before deciding whether later sources are necessary.
      if(isbnMode&&searchResults.some(b=>normalizeISBN(b.isbn)===isbn))break;
      if(!isbnMode&&i>=1&&confidentEnough(searchResults,q)&&searchResults.length>=3)break;
    }catch(e){
      catalogsChecked.push(source);
      // Quietly continue to the next source. One failed catalog should never derail the search.
    }
  }

  searchBusy=false;
  searchResults=rankSearchResults(combined,q);
  if(searchResults.length){
    searchNotice=`Found ${searchResults.length} likely match${searchResults.length===1?'':'es'}. Book discovery is separate from content-analysis availability.`;
  }else{
    searchNotice=`We couldn’t find “${q}” in the available catalogs. You can add the book manually, and authors or publishers can submit an authorized manuscript for analysis.`;
  }
  render();
}

function analyzeText(text){const words=(text.match(/\b[\w’'-]+\b/g)||[]).length,categoriesOut={},details={},triggers=[];for(const [k,label] of categories){let weighted=0,maxW=0;const signals=[];for(const [sig,re,w] of (analysisLex[k]||[])){re.lastIndex=0;const m=text.match(re)||[];if(m.length){weighted+=m.length*w;maxW=Math.max(maxW,w);signals.push([sig,m.length]);triggers.push(sig)}}const score=analysisScore(weighted,maxW,words);categoriesOut[k]=score;const frequency=weighted>=50?'frequent':weighted>=20?'repeated':weighted>=6?'several':weighted?'limited':'no meaningful';details[k]=signals.length?`Automated full-text analysis found ${frequency} indicators in this category. Detected content includes ${signals.sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>`${x[0]} (${x[1]} reference${x[1]===1?'':'s'})`).join(', ')}. This is a screening summary, not a quotation from the manuscript.`:'No meaningful indicators for this category were detected by the local full-text screening rules.'}const vals=Object.values(categoriesOut),severe=vals.filter(v=>v>=4).length;let age='8+';if(categoriesOut.sexual>=5||categoriesOut.violence>=5||categoriesOut.selfharm>=5)age='16+';else if(categoriesOut.sexual>=4||categoriesOut.selfharm>=4||severe>=3)age='14+';else if(severe>=1||categoriesOut.death>=4||categoriesOut.fear>=4)age='12+';else if(vals.filter(v=>v>=3).length>=3)age='10+';details.age=`This automated recommendation is based on the strongest detected content categories and their frequency across approximately ${words.toLocaleString()} words. A human/editorial review should confirm the final age guidance.`;return {age,categories:categoriesOut,triggers:[...new Set(triggers)].slice(0,12),details,wordCount:words}}
async function analyzeClaimedManuscript(id){const confirm=document.getElementById('rightsConfirm'),file=document.getElementById('manuscriptFile')?.files?.[0];if(!confirm?.checked){alert('Confirm that you are authorized to submit this manuscript.');return}if(!file){alert('Choose a manuscript file first.');return}const b=[...state.customBooks,...searchResults,state.saved].find(x=>makeId(x)===id)||selectedBook;if(!b){alert('Book record not found.');return}try{document.getElementById('modalContent').innerHTML='<h2>Analyzing manuscript…</h2><p class="small muted">Extracting the complete text and screening all supported content categories locally.</p>';const text=await extractManuscriptText(file);if(text.length<500){throw new Error('The extracted manuscript text is too short to analyze reliably.')}const a=analyzeText(text);state.rightsProfiles[id]={title:b.title,author:b.author,age:a.age,categories:a.categories,triggers:a.triggers,details:a.details,sources:[{name:'Rights-holder Full-Text Analysis',kind:'Authorized manuscript analyzed locally'}],wordCount:a.wordCount,analyzedAt:new Date().toISOString(),fileType:file.name.split('.').pop().toUpperCase()};if(!state.customBooks.some(x=>makeId(x)===id))state.customBooks.unshift({...b,source:b.source||'Rights-holder submission',cover:''});save();document.getElementById('modal').close();selectedBook=b;render()}catch(e){document.getElementById('modalContent').innerHTML=`<h2>Could not analyze this file</h2><div class="notice">${esc(e.message||String(e))}</div><button class="btn full" style="margin-top:12px" onclick="document.getElementById('modal').close()">Close</button>`}}

function establishedMatchScore(r,b){const nt=normalizeText(b.title),na=normalizeText(b.author),rt=normalizeText(r.title),ra=normalizeText(r.author),aliases=(r.aliases||[]).map(normalizeText);let s=0;if(nt===rt||aliases.includes(nt))s+=100;if(nt.includes(rt)||rt.includes(nt))s+=35;const ta=tokens(r.title),tb=tokens(b.title);s+=ta.filter(x=>tb.includes(x)).length*12;const aa=tokens(r.author),ab=tokens(b.author);s+=aa.filter(x=>ab.includes(x)).length*10;return s}
function findEstablished(b){return null}
function getRating(b){return b?state.ratings[makeId(b)]||null:null}
function buildProfile(b){
  if(!b)return null;
  const rights=findRightsProfile(b),mine=getRating(b);
  if(rights){
    const cats={...rights.categories};
    if(mine?.categories){for(const [k] of categories){if(mine.categories[k])cats[k]=(Number(cats[k]||0)+Number(mine.categories[k]))/2}}
    return {quality:mine?.quality||0,age:mine?.age||rights.age||'',categories:cats,confidence:mine?'Authorized text + your rating':'Authorized full-text screening',rights:true,mine:!!mine};
  }
  if(mine)return {quality:mine.quality||0,age:mine.age||'',categories:{...mine.categories},confidence:'Your rating only',mine:true};
  return null;
}
function hasTrustedAnalysis(b){return !!findRightsProfile(b)}
function analysisAvailabilityMarkup(b){
  const rights=findRightsProfile(b),mine=getRating(b);
  if(rights)return `<div class="evidence-badge">✓ Authorized manuscript screening available</div>`;
  if(mine)return `<div class="evidence-badge">Your structured rating is saved</div>`;
  return `<div class="small muted" style="margin-top:7px">Content analysis not yet available</div>`;
}
function bookCard(b,i){
  const rights=findRightsProfile(b),mine=getRating(b);
  const cover=`<div class="cover" style="display:grid;place-items:center;font-size:28px">📚</div>`;
  const coverage=(b.sourceNames||[b.source]).filter(Boolean);
  return `<article class="book-card">${cover}<div>
    <h3>${esc(b.title)}${rights?'<span class="pre-rated">FULL TEXT</span>':''}</h3>
    <div class="book-meta">${esc(b.author)}${b.year?` • ${esc(b.year)}`:''}${b.publisher?`<br>${esc(b.publisher)}`:''}${b.isbn?`<br>ISBN ${esc(b.isbn)}`:''}</div>
    ${analysisAvailabilityMarkup(b)}
    <div class="book-actions"><button class="btn" onclick="openBook(${i})">View book</button><button class="btn secondary" onclick="saveBook(${i})">${state.saved.some(x=>makeId(x)===makeId(b))?'Saved':'Save'}</button></div>
    <details class="data-details"><summary>Catalog details</summary><p>${coverage.length>1?`Matched across ${coverage.length} catalog records.`:'Matched in the book catalog.'}</p></details>
  </div></article>`
}
function catalogRatingMarkup(b){return b.catalogRating?`<div class="evidence-badge">★ ${Number(b.catalogRating).toFixed(1)}/5${b.catalogRatingCount?` • ${Number(b.catalogRatingCount).toLocaleString()} catalog rating${Number(b.catalogRatingCount)===1?'':'s'}`:''}</div>`:''}
function renderDetail(b){
  const profile=buildProfile(b),rights=findRightsProfile(b),mine=getRating(b),saved=state.saved.some(x=>makeId(x)===makeId(b));
  const cover=`<div class="cover" style="display:grid;place-items:center;font-size:34px">📚</div>`;
  const contentSection=profile
    ?renderAggregate(profile)
    :`<section class="empty"><strong>Book found — not enough reliable content information yet.</strong><p class="small">BookGuide identified this title, but we do not currently have an authorized full-text analysis or structured parent rating for it. We will not estimate violence, language, sexual content, age guidance, or other categories from a synopsis, popularity, title, or metadata.</p><div class="book-actions"><button class="btn" onclick="startRating()">Add a structured parent rating</button><button class="btn secondary" onclick="openClaimBook(selectedBook)">Author / publisher manuscript analysis</button></div></section>`;
  return `<div class="detail"><button class="btn ghost" onclick="selectedBook=null;render()">← Back</button>
  <section class="detail-top">${cover}<div><h2>${esc(b.title)}</h2><div class="muted">${esc(b.author)}</div><div class="book-meta" style="margin-top:8px">${b.publisher?esc(b.publisher):''}${b.year?` • ${esc(b.year)}`:''}${b.pageCount?` • ${esc(b.pageCount)} pages`:''}${b.isbn?`<br>ISBN ${esc(b.isbn)}`:''}</div>${catalogRatingMarkup(b)}${analysisAvailabilityMarkup(b)}<div class="chips">${(b.subjects||[]).slice(0,6).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="book-actions"><button class="btn" onclick="startRating()">Rate this book</button><button class="btn secondary" onclick="toggleSavedSelected()">${saved?'Remove saved':'Save book'}</button><button class="btn ghost" onclick="openClaimBook(selectedBook)">Claim / analyze manuscript</button></div></div></section>
  ${rights?`<section class="analysis-card"><div class="section-head" style="margin:0"><div><h2>Authorized full-text screening</h2><p class="small muted">Derived from a rights-holder manuscript submitted to this device. This is automated screening, not a copied third-party review.</p></div><span class="evidence-badge">${Number(rights.wordCount||0).toLocaleString()} words</span></div><div class="analysis-status"><div class="analysis-kpi"><strong>${esc(rights.age||'—')}</strong><span>automated age guidance</span></div><div class="analysis-kpi"><strong>${Object.values(rights.categories||{}).filter(v=>v>=4).length}</strong><span>strong/extreme categories</span></div><div class="analysis-kpi"><strong>${esc(rights.fileType||'TEXT')}</strong><span>analyzed source</span></div></div><p class="analysis-note">Because this prototype uses local deterministic screening rather than a server-side semantic model, treat these scores as preliminary screening. The detailed notes show what the detector found.</p></section>`:''}
  ${contentSection}
  ${rights?renderContentExplanations(rights):''}
  <section class="panel"><div class="section-head" style="margin:0 0 10px"><h2>About this edition</h2></div><p class="small muted">${esc((b.description||'Book description is not available from the current catalog record.').replace(/<[^>]*>/g,'').slice(0,800))}</p><details class="data-details"><summary>Data sources</summary><p>${esc((b.sourceNames||[b.source]).filter(Boolean).join(', '))}. Catalog sources establish book identity and metadata only; they do not automatically become content ratings.</p></details></section></div>`
}
function renderAggregate(a){
  const sourceText=a.rights?(a.mine?'authorized full-text screening + your structured rating':'authorized full-text screening'):'your structured rating only';
  return `<section class="rating-overview"><div class="panel"><div class="score-label">${a.quality?'Your quality rating':'Content guidance'}</div><div class="score-big">${a.quality||'—'}${a.quality?'<span style="font-size:22px">/5</span>':''}</div><div class="score-label">Recommended age: <strong>${esc(a.age||'Not enough data')}</strong></div><div class="confidence">● ${esc(a.confidence)}</div><div class="notice" style="margin-top:14px"><strong>Evidence:</strong> ${esc(sourceText)}. BookGuide does not create category scores merely because a book was found in a catalog.</div></div><div class="panel"><strong>${a.rights?'Available content screening':'Your submitted content profile'}</strong><div class="warning-grid" style="margin-top:12px">${categories.map(([k,label])=>warningRow(label,a.categories?.[k]||0)).join('')}</div></div></section>`
}
function warningRow(label,v){const width=v?((v-1)/4*100):0,level=v?scaleLabels[Math.max(0,Math.min(4,Math.round(v)-1))]:'No data';return `<div class="warning-row"><span class="warning-name">${esc(label)}</span><div class="bar"><span style="width:${width}%"></span></div><span class="warning-value"><b class="level">${v?Number(v).toFixed(1):'—'}</b><small class="level-text">${level}</small></span></div>`}
function renderEstablishedEvidence(r){return ''}

function toggleSavedSelected(){const id=makeId(selectedBook),i=state.saved.findIndex(x=>makeId(x)===id);if(i>=0)state.saved.splice(i,1);else state.saved.unshift(selectedBook);save();render()}
let draft={};
function startRating(){draft=JSON.parse(JSON.stringify(getRating(selectedBook)||{quality:0,age:'',categories:{}}));document.getElementById('modalContent').innerHTML=ratingForm(selectedBook);document.getElementById('modal').showModal()}
function ratingForm(b){return `<h2>Rate ${esc(b.title)}</h2><p class="small muted">No written reviews. Choose only structured options.</p><div class="rate-group"><div class="rate-group-head"><strong>Overall book quality</strong><span class="small muted">1–5 stars</span></div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${draft.quality>=n?'selected':''}" onclick="setQuality(${n})">★</button>`).join('')}</div></div><div class="rate-group"><div class="rate-group-head"><strong>Youngest age you'd recommend</strong></div><div class="age-grid">${ageOptions.map(a=>`<button class="${draft.age===a?'selected':''}" onclick="setAge('${a}')">${a}</button>`).join('')}</div></div>${categories.map(([k,l])=>`<div class="rate-group"><div class="rate-group-head"><strong>${esc(l)}</strong><span class="small muted">${draft.categories[k]?scaleLabels[draft.categories[k]-1]:'Choose level'}</span></div><div class="scale">${[1,2,3,4,5].map(n=>`<button class="${draft.categories[k]===n?'selected':''}" onclick="setCat('${k}',${n})">${n}<br><span style="font-weight:500">${scaleLabels[n-1]}</span></button>`).join('')}</div></div>`).join('')}<button class="btn full" onclick="submitRating()">Submit structured rating</button><button class="btn ghost full" style="margin-top:8px" onclick="document.getElementById('modal').close()">Cancel</button><p class="privacy-line">This prototype stores your rating on this device. A production version would submit only these structured values to the shared database.</p>`}
function refreshRatingModal(){document.getElementById('modalContent').innerHTML=ratingForm(selectedBook)}
function setQuality(n){draft.quality=n;refreshRatingModal()}function setAge(a){draft.age=a;refreshRatingModal()}function setCat(k,n){draft.categories[k]=n;refreshRatingModal()}
function submitRating(){if(!draft.quality||!draft.age){alert('Please choose an overall quality rating and recommended age.');return}for(const [k] of categories)if(!draft.categories[k])draft.categories[k]=1;state.ratings[makeId(selectedBook)]=draft;save();document.getElementById('modal').close();render()}
function renderSaved(){return `<div class="stack"><section class="hero"><div class="eyebrow">Your shelf</div><h2>Books you want to check, remember, or revisit.</h2><p>Saved books stay on this device in the prototype.</p></section><div class="section-head"><h2>Saved books</h2><span class="small muted">${state.saved.length}</span></div>${state.saved.length?state.saved.map((b,i)=>`<div class="saved-row"><div class="cover" style="width:48px;height:68px;display:grid;place-items:center;font-size:22px">📚</div><div class="grow"><strong>${esc(b.title)}</strong><span class="small muted">${esc(b.author)}</span></div><button class="btn secondary" onclick="selectedBook=state.saved[${i}];render()">Open</button><button class="icon-btn" onclick="removeSaved('${esc(makeId(b)).replace(/'/g,"\\'")}')">×</button></div>`).join(''):`<div class="empty">No saved books yet.</div>`}</div>`}
function renderRateHub(){const rated=Object.keys(state.ratings).length;return `<div class="stack"><section class="hero"><div class="eyebrow">Community ratings</div><h2>Contribute useful data without writing a review.</h2><p>Find a book, select the age range and severity levels, and submit. No comments means less moderation and more consistent data.</p></section><section class="panel"><strong>Your prototype contributions</strong><div class="score-big" style="font-size:34px;margin-top:10px">${rated}</div><span class="score-label">books rated on this device</span></section><section class="panel"><h2 style="margin-top:0">Rating scale</h2>${scaleLabels.map((x,i)=>`<div class="toggle-row"><strong>${i+1}</strong><span>${x}</span></div>`).join('')}</section><button class="btn full" onclick="go('search')">Search for a book to rate</button></div>`}
function renderSettings(){const active=themes[state.theme]||themes.parchment;return `<div class="stack"><section class="hero"><div class="eyebrow">Personalize the app</div><h2>Choose a reading-room look that feels like yours.</h2><p>Switch the entire interface between light and dark palettes. Your selection is saved automatically on this device.</p></section><section class="settings-card"><div class="theme-section-title"><h2>Color palette</h2><span class="mode-badge">${esc(active.mode)} mode</span></div><p class="small muted">Every palette changes backgrounds, cards, buttons, navigation, highlights, warning surfaces, and accents—not just one color.</p><div class="theme-grid">${Object.entries(themes).map(([id,t])=>`<button class="theme-card ${state.theme===id?'selected':''}" onclick="setTheme('${id}')"><div class="theme-swatches"><span style="background:${t.vars.bg}"></span><span style="background:${t.vars.panel2}"></span><span style="background:${t.vars.accent}"></span><span style="background:${t.vars.accent2}"></span><span style="background:${t.vars.hero2}"></span></div><div><strong>${esc(t.name)}</strong><small>${esc(t.mode)} • ${esc(t.desc)}</small>${state.theme===id?'<div class="chosen">✓ Current palette</div>':''}</div></button>`).join('')}</div></section><section class="settings-card"><h2 style="margin-top:0">Highlight these categories</h2><p class="small muted">Choose the content types you want the app to surface most prominently.</p>${categories.map(([k,l])=>`<label class="toggle-row"><span>${esc(l)}</span><input type="checkbox" ${state.avoid.includes(k)?'checked':''} onchange="toggleAvoid('${k}',this.checked)"></label>`).join('')}</section><section class="settings-card"><strong>Book search</strong><p class="small muted">You only use one search box. BookGuide searches its local records and multiple external catalogs behind one search box. Discovery is ranked only by title, author, ISBN, and edition metadata — never by whether a book already has content ratings.</p><details class="data-details"><summary>Advanced developer settings</summary><p>These credentials are only for testing this single-file prototype. In production they belong on the BookGuide server and parents should never see or enter them.</p><div class="form-field"><label>Google Books API key</label><input id="googleBooksKey" type="password" value="${esc(state.googleBooksKey||'')}" placeholder="Optional Google key"></div><div class="form-field"><label>ISBNdb API key</label><input id="isbndbKey" type="password" value="${esc(state.isbndbKey||'')}" placeholder="Optional extended-catalog key"></div><button class="btn secondary" onclick="saveCatalogKeys()">Save developer keys</button></details></section><section class="settings-card"><strong>Author / publisher submissions</strong><p class="small muted">Missing books can be added manually and claimed by an authorized rights holder. TXT, MD, HTML, DOCX, and EPUB manuscripts can be analyzed locally in this prototype. The derived rating profile is saved; the manuscript text is not.</p></section><section class="settings-card"><strong>Data policy for the production app</strong><p class="small muted">Book identity and content analysis are separate systems. Use broad catalog APIs and licensed bibliographic feeds to find books; use authorized manuscripts, licensed structured content-rating partners, and structured parent surveys for content guidance. Never manufacture category scores from metadata or copy prohibited review content.</p></section></div>`}
function saveCatalogKeys(){state.googleBooksKey=(document.getElementById('googleBooksKey')?.value||'').trim();state.isbndbKey=(document.getElementById('isbndbKey')?.value||'').trim();save();searchNotice='Developer catalog credentials saved on this device.';go('search')}function saveGoogleBooksKey(){saveCatalogKeys()}
function toggleAvoid(k,on){if(on&&!state.avoid.includes(k))state.avoid.push(k);if(!on)state.avoid=state.avoid.filter(x=>x!==k);save()}
function openAbout(){document.getElementById('modalContent').innerHTML=`<h2>About Book Content Guide</h2><p>This is a standalone one-file beta for structured book-content ratings. It is designed to run from a single GitHub Pages index.html file.</p><div class="notice"><strong>Important:</strong> Search uses one unified flow: the local index is checked first, then additional catalogs are checked one at a time only as needed. Google Books, Open Library, Library of Congress, Crossref, Internet Archive metadata, and an optional licensed ISBNdb feed are part of the search system without requiring the parent to choose between them. Content ratings are shown only when supported by authorized full-text analysis, licensed structured rating feeds, or structured community surveys. Catalog metadata alone never creates a content rating. Third-party sites should be integrated through permission or licensed APIs rather than prohibited scraping.</div><button class="btn full" style="margin-top:14px" onclick="document.getElementById('modal').close()">Close</button>`;document.getElementById('modal').showModal()}
applyTheme();
render();
</script>
